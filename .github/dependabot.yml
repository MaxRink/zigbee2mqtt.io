version: 2
updates:
    - package-ecosystem: 'github-actions'
      directory: /
      schedule:
          interval: quarterly
      groups:
          github-actions:
              patterns:
                  - '*'
      commit-message:
          prefix: chore
    - package-ecosystem: npm
      versioning-strategy: increase
      directory: /
      schedule:
          interval: weekly
      ignore:
          # Updated with the monthly z2m release
          - dependency-name: zigbee-herdsman-converters
      groups:
          all:
              applies-to: version-updates
              patterns:
                  - '*'
      commit-message:
          prefix: fix(ignore)
    - package-ecosystem: devcontainers
      directory: /
      schedule:
        interval: weekly
      open-pull-requests-limit: 5
      groups:
        routine-updates:
          patterns:
          - '*'
          update-types:
          - minor
          - patch
